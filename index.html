<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusCare - Campus Health Management System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1d6fa5;--primary-dark:#155a87;--primary-light:#e6f1fb;--primary-mid:#378add;
  --success:#3b6d11;--success-bg:#eaf3de;--success-border:#c0dd97;
  --danger:#a32d2d;--danger-bg:#fcebeb;--danger-border:#f7c1c1;
  --warning:#854f0b;--warning-bg:#faeeda;--warning-border:#FAC775;
  --info:#185fa5;--info-bg:#e6f1fb;--info-border:#b5d4f4;
  --gray:#5f5e5a;--gray-light:#f1efe8;--gray-border:#d3d1c7;--gray-mid:#888780;
  --purple:#534AB7;--purple-bg:#EEEDFE;--purple-border:#AFA9EC;
  --teal:#0F6E56;--teal-bg:#E1F5EE;--teal-border:#5DCAA5;
  --coral:#993C1D;--coral-bg:#FAECE7;--coral-border:#F0997B;
  --sidebar-w:235px;--header-h:52px;
}
body{font-family:system-ui,-apple-system,sans-serif;font-size:14px;background:#f0ede8;color:#2c2c2a;min-height:100vh;display:flex}

/* ===SCROLLBAR=== */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d3d1c7;border-radius:3px}

/* ===AUTH=== */
#auth-wrap{position:fixed;inset:0;background:linear-gradient(135deg,#1d6fa5 0%,#0c447c 100%);display:flex;align-items:center;justify-content:center;z-index:9999;padding:1rem}
.auth-box{background:#fff;border-radius:16px;width:100%;max-width:460px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.auth-header{background:linear-gradient(135deg,#1d6fa5,#0c447c);padding:2rem;text-align:center;color:#fff}
.auth-header h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px}
.auth-header p{font-size:.82rem;opacity:.8;margin-top:4px}
.auth-body{padding:1.75rem}
.auth-tabs{display:flex;border-radius:8px;overflow:hidden;border:1px solid #d3d1c7;margin-bottom:1.25rem}
.auth-tab{flex:1;padding:.5rem;background:#f5f5f3;border:none;cursor:pointer;font-size:.85rem;transition:.15s}
.auth-tab.active{background:var(--primary);color:#fff;font-weight:500}
.demo-accounts{background:#f5f5f3;border-radius:8px;padding:.7rem .9rem;margin-bottom:1rem;font-size:.78rem;line-height:1.7;border:1px solid #e0ddd7}
.demo-accounts strong{color:var(--primary);display:block;margin-bottom:2px}

/* ===APP SHELL=== */
#app{display:none;width:100%;min-height:100vh}
#app.visible{display:flex}

/* ===SIDEBAR=== */
#sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid #d3d1c7;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto;overflow-x:hidden}
.sb-brand{padding:1rem 1.1rem;border-bottom:1px solid #d3d1c7;display:flex;align-items:center;gap:.6rem}
.sb-brand-icon{width:32px;height:32px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.sb-brand h2{font-size:.95rem;font-weight:700;color:var(--primary)}
.sb-brand p{font-size:.68rem;color:#888}
.sb-profile{padding:.85rem 1.1rem;border-bottom:1px solid #ebe8e0;display:flex;align-items:center;gap:.6rem}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
.sb-profile-info{min-width:0}
.sb-profile-info strong{display:block;font-size:.83rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-profile-info span{font-size:.72rem;color:#888}
.sb-role-badge{font-size:.65rem;padding:1px 6px;border-radius:10px;margin-top:2px;display:inline-block}
.sb-section{padding:.4rem .7rem .15rem;font-size:.65rem;text-transform:uppercase;letter-spacing:.8px;color:#aaa;margin-top:.5rem}
nav a,nav button{display:flex;align-items:center;gap:.55rem;padding:.48rem 1rem;cursor:pointer;font-size:.83rem;color:#444;text-decoration:none;background:none;border:none;width:100%;text-align:left;border-radius:0;transition:all .12s;position:relative}
nav a:hover,nav button:hover{background:#f5f5f3;color:#222}
nav a.active,nav button.active{background:var(--primary-light);color:var(--primary);font-weight:500}
nav a.active::before,nav button.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);border-radius:0 2px 2px 0}
nav svg{width:15px;height:15px;flex-shrink:0;stroke-width:1.8}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;border-radius:10px;padding:0 5px;font-size:.65rem;min-width:16px;text-align:center}
.sb-bottom{margin-top:auto;border-top:1px solid #d3d1c7;padding:.6rem}
.sb-logout{display:flex;align-items:center;gap:.5rem;width:50%;padding:.45rem .8rem;border:1px solid #d3d1c7;border-radius:8px;background:#fff;cursor:pointer;font-size:.8rem;color:#666;transition:.12s}
.sb-logout:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}

/* ===MAIN=== */
#main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-width:0;min-height:100vh}
.top-bar{height:var(--header-h);background:#fff;border-bottom:1px solid #d3d1c7;display:flex;align-items:center;padding:0 1.25rem;gap:.75rem;position:sticky;top:0;z-index:50}
.top-bar h2{font-size:.95rem;font-weight:600;flex:1}
.top-bar-actions{display:flex;align-items:center;gap:.5rem}
.notif-btn{position:relative;background:none;border:none;cursor:pointer;padding:.3rem;border-radius:6px;color:#666}
.notif-btn:hover{background:#f5f5f3}
.notif-dot{position:absolute;top:2px;right:2px;width:7px;height:7px;background:var(--danger);border-radius:50%;border:1.5px solid #fff}
.content{padding:1.25rem;flex:1}

/* ===PAGES=== */
.page{display:none}.page.active{display:block}

/* ===CARDS=== */
.card{background:#fff;border-radius:12px;border:1px solid #d3d1c7;padding:1.1rem 1.2rem;margin-bottom:1rem}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem;padding-bottom:.7rem;border-bottom:1px solid #ebe8e0}
.card-header h3{font-size:.9rem;font-weight:600}
.card-title{font-size:.9rem;font-weight:600;margin-bottom:.9rem}

/* ===STATS=== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;margin-bottom:1rem}
.stat-card{background:#fff;border-radius:10px;border:1px solid #d3d1c7;padding:.9rem 1rem}
.stat-card.colored{border:none}
.stat-val{font-size:1.5rem;font-weight:700;line-height:1.1}
.stat-lbl{font-size:.72rem;color:#888;margin-top:3px}
.stat-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:.5rem}
.stat-icon svg{width:18px;height:18px}

/* ===GRID=== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem}
.full{grid-column:1/-1}

/* ===FORMS=== */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.form-group{display:flex;flex-direction:column;gap:.28rem;margin-bottom:.6rem}
.form-group label{font-size:.78rem;font-weight:500;color:#555}
.form-group input,.form-group select,.form-group textarea{padding:.42rem .7rem;border:1px solid #d3d1c7;border-radius:7px;font-size:.87rem;font-family:inherit;transition:border .15s;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,111,165,.08)}
.form-group input:disabled,.form-group select:disabled{background:#f5f5f3;color:#888}
.form-group.full{grid-column:1/-1}
.form-note{font-size:.75rem;color:#888;margin-top:2px}
.required{color:var(--danger)}
input[type="file"]{padding:.35rem .5rem;font-size:.82rem;cursor:pointer}

/* ===BTNS=== */
.btn{padding:.4rem .85rem;border-radius:7px;border:1px solid #d3d1c7;background:#fff;cursor:pointer;font-size:.82rem;font-family:inherit;transition:all .12s;display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
.btn:hover{background:#f5f5f3}.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success-bg);color:var(--success);border-color:var(--success-border)}.btn-success:hover{background:#d5edb4}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}.btn-danger:hover{background:#f7c1c1}
.btn-warning{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border)}
.btn-info{background:var(--info-bg);color:var(--info);border-color:var(--info-border)}
.btn-purple{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-border)}
.btn-sm{padding:.27rem .6rem;font-size:.76rem}
.btn-xs{padding:.2rem .45rem;font-size:.7rem}
.btn-icon{padding:.35rem;border-radius:6px}
.btn svg{width:13px;height:13px;stroke-width:2}

/* ===BADGES=== */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:.71rem;font-weight:500;white-space:nowrap}
.badge-success{background:var(--success-bg);color:var(--success)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-warning{background:var(--warning-bg);color:var(--warning)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-gray{background:#f1efe8;color:#5f5e5a}
.badge-purple{background:var(--purple-bg);color:var(--purple)}
.badge-teal{background:var(--teal-bg);color:var(--teal)}
.badge-coral{background:var(--coral-bg);color:var(--coral)}

/* ===TABLES=== */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{background:#f8f7f4;padding:.5rem .8rem;text-align:left;font-weight:500;font-size:.74rem;color:#666;border-bottom:1px solid #d3d1c7;white-space:nowrap}
td{padding:.5rem .8rem;border-bottom:1px solid #ebe8e0;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafaf8}
.td-actions{display:flex;gap:.3rem;flex-wrap:wrap}

/* ===ALERTS=== */
.alert{padding:.65rem 1rem;border-radius:8px;font-size:.83rem;margin-bottom:.75rem;display:none;align-items:flex-start;gap:.5rem}
.alert.show{display:flex}
.alert-danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border)}
.alert-success{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border)}
.alert-warning{background:var(--warning-bg);color:var(--warning);border:1px solid var(--warning-border)}
.alert-info{background:var(--info-bg);color:var(--info);border:1px solid var(--info-border)}

/* ===MODALS=== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;z-index:8000;padding:2rem 1rem;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 8px 40px rgba(0,0,0,.15);margin:auto}
.modal-lg{max-width:720px}
.modal-xl{max-width:900px}
.modal-sm{max-width:380px}
.modal-header{padding:1.1rem 1.25rem;border-bottom:1px solid #ebe8e0;display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:.95rem;font-weight:600}
.modal-body{padding:1.25rem}
.modal-footer{padding:.9rem 1.25rem;border-top:1px solid #ebe8e0;display:flex;justify-content:flex-end;gap:.5rem}
.close-btn{background:none;border:none;cursor:pointer;color:#888;padding:.2rem;border-radius:4px;line-height:0}
.close-btn:hover{color:#333;background:#f5f5f3}

/* ===SEARCH=== */
.toolbar{display:flex;gap:.6rem;align-items:center;margin-bottom:.9rem;flex-wrap:wrap}
.toolbar input[type=text],.toolbar input[type=search]{padding:.4rem .7rem;border:1px solid #d3d1c7;border-radius:7px;font-size:.83rem;flex:1;min-width:180px}
.toolbar select{padding:.4rem .6rem;border:1px solid #d3d1c7;border-radius:7px;font-size:.82rem}

/* ===TABS=== */
.tabs{display:flex;border-bottom:2px solid #ebe8e0;margin-bottom:1rem;gap:0;overflow-x:auto}
.tab{padding:.45rem .9rem;cursor:pointer;font-size:.82rem;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s;white-space:nowrap;background:none;border-left:none;border-right:none;border-top:none}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.tab:hover{color:#444}

/* ===MISC=== */
.empty-state{text-align:center;padding:2.5rem 1rem;color:#888}
.empty-state svg{width:42px;height:42px;margin:0 auto .75rem;display:block;opacity:.35;stroke:currentColor}
.empty-state p{font-size:.85rem}
.divider{border:none;border-top:1px solid #ebe8e0;margin:.75rem 0}
.text-muted{color:#888;font-size:.8rem}
.text-danger{color:var(--danger)}
.text-success{color:var(--success)}
.text-warning{color:var(--warning)}
.text-primary{color:var(--primary)}
.fw-500{font-weight:500}
.section-label{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#888;margin-bottom:.5rem}
.info-row{display:flex;font-size:.83rem;padding:.3rem 0;border-bottom:1px solid #f0ede8}
.info-row:last-child{border-bottom:none}
.info-label{color:#888;width:140px;flex-shrink:0}
.info-val{font-weight:500;flex:1}

/* ===NOTIFICATION PANEL=== */
.notif-panel{position:fixed;top:var(--header-h);right:0;width:320px;background:#fff;border-left:1px solid #d3d1c7;border-bottom:1px solid #d3d1c7;border-radius:0 0 0 12px;box-shadow:-4px 4px 20px rgba(0,0,0,.1);z-index:200;display:none;max-height:420px;overflow-y:auto}
.notif-panel.show{display:block}
.notif-panel-header{padding:.7rem 1rem;border-bottom:1px solid #ebe8e0;font-size:.85rem;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.notif-item{padding:.65rem 1rem;border-bottom:1px solid #f0ede8;font-size:.8rem;cursor:pointer;transition:.12s}
.notif-item:hover{background:#fafaf8}
.notif-item.unread{background:#fefaee}
.notif-item-title{font-weight:500;margin-bottom:2px}
.notif-item-time{font-size:.72rem;color:#aaa}
.notif-type-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px}

/* ===CALENDAR=== */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:.5rem}
.cal-day-header{text-align:center;font-size:.7rem;font-weight:600;color:#888;padding:.3rem 0}
.cal-day{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;cursor:pointer;position:relative;border:1px solid transparent;transition:.12s;min-height:36px}
.cal-day:hover:not(.empty){background:#f0ede8}
.cal-day.today{background:var(--primary-light);color:var(--primary);font-weight:700;border-color:var(--primary-mid)}
.cal-day.has-appt::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;background:var(--primary);border-radius:50%}
.cal-day.blocked{background:#f5f5f3;color:#ccc;cursor:default}
.cal-day.selected{background:var(--primary);color:#fff}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.cal-nav button{background:none;border:1px solid #d3d1c7;border-radius:6px;padding:.25rem .5rem;cursor:pointer}

/* ===PROGRESS BARS=== */
.progress-bar{height:5px;background:#ebe8e0;border-radius:3px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:3px;transition:width .4s}

/* ===UPLOAD=== */
.upload-area{border:2px dashed #d3d1c7;border-radius:10px;padding:1.25rem;text-align:center;cursor:pointer;transition:.15s;background:#fafaf8}
.upload-area:hover{border-color:var(--primary);background:var(--primary-light)}
.upload-area input{display:none}
.upload-area p{font-size:.82rem;color:#888;margin-top:.3rem}

/* ===COLLEGE COLORS=== */
.college-CCICT{background:#e6f1fb;color:#185fa5;border-color:#b5d4f4}
.college-COE{background:#eaf3de;color:#3b6d11;border-color:#c0dd97}
.college-COED{background:#faeeda;color:#854f0b;border-color:#FAC775}
.college-CME{background:#fcebeb;color:#a32d2d;border-color:#f7c1c1}
.college-CAS{background:#EEEDFE;color:#534AB7;border-color:#AFA9EC}
.college-COT{background:#E1F5EE;color:#0F6E56;border-color:#5DCAA5}

/* ===TIMELINE=== */
.timeline{display:flex;flex-direction:column;gap:.5rem}
.tl-item{display:flex;gap:.75rem;align-items:flex-start}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px}
.tl-content{flex:1;font-size:.82rem}
.tl-time{font-size:.72rem;color:#aaa}

/* ===TOAST=== */
#toast-wrap{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.toast{background:#2c2c2a;color:#fff;padding:.6rem 1rem;border-radius:8px;font-size:.82rem;pointer-events:auto;animation:slideIn .25s ease;max-width:280px;display:flex;align-items:center;gap:.5rem}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.warning{background:#854f0b}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===SCHEDULE SLOTS=== */
.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.5rem}
.slot{padding:.4rem;border-radius:6px;text-align:center;font-size:.75rem;border:1px solid #d3d1c7;cursor:pointer;transition:.12s}
.slot:hover:not(.booked):not(.blocked){border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.slot.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
.slot.booked{background:#f5f5f3;color:#ccc;cursor:not-allowed}
.slot.blocked{background:#faeeda;color:#854f0b;cursor:not-allowed;font-size:.7rem}

/* ===RESPONSIVE=== */
@media(max-width:768px){
  #sidebar{transform:translateX(-100%);transition:.25s}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  .grid-2,.form-row{grid-template-columns:1fr}
  .grid-3{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- TOAST -->
<div id="toast-wrap"></div>

<!-- AUTH -->
<div id="auth-wrap">
<div class="auth-box">
  <div class="auth-header">
    <h1>🏥 CampusCare</h1>
    <p>Campus Health Management System</p>
  </div>
  <div class="auth-body">
    <div class="auth-tabs" id="auth-tabs">
      <button class="auth-tab active" onclick="authTab('login')">Login</button>
      <button class="auth-tab" onclick="authTab('reg')">Register</button>
    </div>

    <!-- LOGIN -->
    <div id="login-section">
      <div class="alert alert-danger" id="login-err"></div>
      <div class="form-group"><label>Username</label><input id="li-user" type="text" placeholder="Enter username" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div class="form-group"><label>Password</label><input id="li-pass" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:.3rem" onclick="doLogin()">Login to CampusCare</button>
     
    </div>

    <!-- REGISTER -->
    <div id="reg-section" style="display:none">
      <div class="alert alert-info show" style="margin-bottom:.8rem;font-size:.78rem">
        📋 Registration requires admin approval. Upload your Valid Government ID, School ID or COR.
      </div>
      <div class="alert alert-danger" id="reg-err"></div>
      <div class="alert alert-success" id="reg-ok"></div>
      <div class="form-row">
        <div class="form-group"><label>First Name <span class="required">*</span></label><input id="r-fname" type="text"></div>
        <div class="form-group"><label>Last Name <span class="required">*</span></label><input id="r-lname" type="text"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Username <span class="required">*</span></label><input id="r-user" type="text"></div>
        <div class="form-group"><label>Email <span class="required">*</span></label><input id="r-email" type="email"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Password <span class="required">*</span></label><input id="r-pass" type="password"></div>
        <div class="form-group"><label>Contact No.</label><input id="r-contact" type="text"></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Person Type <span class="required">*</span></label>
          <select id="r-ptype" onchange="updateCollegeField()">
            <option value="Student">Student</option>
            <option value="Teaching Personnel">Teaching Personnel</option>
            <option value="Non-Teaching Personnel">Non-Teaching Personnel</option>
          </select>
        </div>
        <div class="form-group" id="r-college-group">
          <label>College <span class="required">*</span></label>
          <select id="r-college">
            <option value="CCICT">CCICT</option>
            <option value="COE">COE</option>
            <option value="COED">COED</option>

// ================================================================
// UTILITIES
// ================================================================
const TODAY = new Date().toISOString().split('T')[0];
let currentUser = null;
let currentPatient = null;
let activeModal = null;

function toast(msg, type='info', dur=3000){
  const w=document.getElementById('toast-wrap');
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  t.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;flex-shrink:0"><path stroke-linecap="round" stroke-linejoin="round" d="${type==='success'?'M5 13l4 4L19 7':type==='error'?'M6 18L18 6M6 6l12 12':'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z'}"/></svg>${msg}`;
  w.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},dur);
}

function showAlert(el,msg,type='danger'){
  if(!el)return;
  el.className=`alert alert-${type} show`;
  el.innerHTML=msg;
}
function hideAlert(el){if(el){el.classList.remove('show');el.innerHTML='';}}

function getSemester(dateStr){
  if(!dateStr)return null;
  const d=new Date(dateStr);const yr=d.getFullYear();const mo=d.getMonth()+1;
  return mo<=6?`${yr}-S1`:`${yr}-S2`;
}
function currentSemester(){return getSemester(TODAY);}

function fmtDate(d){if(!d)return'-';const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'});}
function fmtDateTime(d){if(!d)return'-';return new Date(d).toLocaleString('en-PH',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function fmtTime(t){if(!t)return'-';const [h,m]=t.split(':');const hr=parseInt(h);return `${hr===0?12:hr>12?hr-12:hr}:${m} ${hr<12?'AM':'PM'}`;}
function dayOfWeek(dateStr){return new Date(dateStr+'T12:00:00').toLocaleDateString('en',{weekday:'short'});}

function statusBadge(s){
  const map={Scheduled:'info',Completed:'success',Cancelled:'danger','Pending':'warning','Active':'success','Suspended':'danger','No-show':'gray'};
  return `<span class="badge badge-${map[s]||'gray'}">${s}</span>`;
}
function collegeBadge(c){
  if(!c)return '';
  return `<span class="badge college-${c}">${c}</span>`;
}
function priorityBadge(p){
  const map={Student:'info',Teaching:'teal','Non-Teaching':'gray'};
  return `<span class="badge badge-${map[p]||'gray'}">${p||'-'}</span>`;
}

function genId(prefix,n){return`${prefix}-${String(n).padStart(4,'0')}`;}

function svgIcon(d,sz=14){return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:${sz}px;height:${sz}px;vertical-align:middle"><path stroke-linecap="round" stroke-linejoin="round" d="${d}"/></svg>`;}

function previewFile(input,previewId){
  const el=document.getElementById(previewId);
  if(el&&input.files[0])el.textContent='✓ '+input.files[0].name;
}

function updateCollegeField(){
  const pt=document.getElementById('r-ptype').value;
  const cg=document.getElementById('r-college-group');
  cg.style.display=pt!=='Student'?'none':'';
}

function checkDentalQuota(patientId,excludeId=null){
  const sem=currentSemester();
  return DB.appointments.filter(a=>
    a.patientId===patientId&&
    a.clinic==='Dental Clinic'&&
    a.status!=='Cancelled'&&
    getSemester(a.date)===sem&&
    a.id!==excludeId
  ).length>=DB.settings.dentalLimitPerSemester;
}

function getLowStock(){return DB.inventory.filter(i=>i.qty<=i.threshold);}

function getPatientByUserId(uid){return DB.patients.find(p=>p.userId===uid)||null;}
function getUserById(id){return DB.users.find(u=>u.id===id);}
function getPatientById(id){return DB.patients.find(p=>p.id===id);}

function getDoctors(){return DB.users.filter(u=>u.role==='Doctor'&&u.status==='Active');}
function getDentalDoctors(){return getDoctors().filter(d=>d.specialty==='Dental');}
function getMedDoctors(){return getDoctors().filter(d=>d.specialty!=='Dental');}

// ================================================================
// NOTIFICATIONS
// ================================================================
function addNotif(userId,title,body,type='info'){
  DB.notifications.push({id:DB.nextNotifId++,userId,title,body,type,read:false,createdAt:new Date().toLocaleString()});
  if(currentUser&&currentUser.id===userId)updateNotifUI();
}

function updateNotifUI(){
  const unread=DB.notifications.filter(n=>n.userId===currentUser.id&&!n.read);
  const dot=document.getElementById('notif-dot');
  if(dot)dot.style.display=unread.length?'':'none';
  renderNotifList();
}

function renderNotifList(){
  const list=document.getElementById('notif-list');
  if(!list)return;
  const notifs=DB.notifications.filter(n=>n.userId===currentUser.id).slice().reverse();
  if(!notifs.length){list.innerHTML='<div class="empty-state" style="padding:1rem"><p>No notifications</p></div>';return;}
  list.innerHTML=notifs.map(n=>`
    <div class="notif-item ${n.read?'':'unread'}" onclick="readNotif(${n.id})">
      <div style="display:flex;gap:.5rem;align-items:flex-start">
        <div class="notif-type-dot" style="background:${n.type==='danger'?'var(--danger)':n.type==='success'?'#639922':n.type==='warning'?'#EF9F27':'var(--primary)'}"></div>
        <div style="flex:1">
          <div class="notif-item-title">${n.title}</div>
          <div style="color:#666;margin-bottom:2px">${n.body}</div>
          <div class="notif-item-time">${n.createdAt}</div>
        </div>
      </div>
    </div>`).join('');
}

function readNotif(id){
  const n=DB.notifications.find(x=>x.id===id);
  if(n){n.read=true;}
  updateNotifUI();
}
function markAllRead(){
  DB.notifications.filter(n=>n.userId===currentUser.id).forEach(n=>n.read=true);
  updateNotifUI();
}
function toggleNotifPanel(){
  const p=document.getElementById('notif-panel');
  p.classList.toggle('show');
  if(p.classList.contains('show'))renderNotifList();
}
document.addEventListener('click',e=>{
  const p=document.getElementById('notif-panel');
  const btn=document.getElementById('notif-btn');
  if(p&&btn&&!p.contains(e.target)&&!btn.contains(e.target))p.classList.remove('show');
});

// Check appointment reminders on login
function checkReminders(){
  if(!currentUser||currentUser.role!=='Patient')return;
  const pt=getPatientByUserId(currentUser.id);
  if(!pt)return;
  const reminderDays=DB.settings.appointmentReminderDays;
  DB.appointments.forEach(a=>{
    if(a.patientId!==pt.id||a.status!=='Scheduled')return;
    const diff=(new Date(a.date)-new Date(TODAY))/(1000*60*60*24);
    if(diff>=0&&diff<=reminderDays){
      const existing=DB.notifications.find(n=>n.userId===currentUser.id&&n.title.includes(a.date)&&!n.read);
      if(!existing){
        addNotif(currentUser.id,'Upcoming Appointment Reminder',
          `You have a ${a.clinic} appointment on ${fmtDate(a.date)} at ${fmtTime(a.time)}.`,'warning');
      }
    }
  });
}

function authTab(t){
  document.querySelectorAll('.auth-tab').forEach((b,i)=>b.classList.toggle('active',i===(t==='login'?0:1)));
  document.getElementById('login-section').style.display=t==='login'?'':'none';
  document.getElementById('reg-section').style.display=t==='reg'?'':'none';
}

function doLogin(){
  const u=document.getElementById('li-user').value.trim();
  const p=document.getElementById('li-pass').value;
  const err=document.getElementById('login-err');
  hideAlert(err);
  if(!u||!p){showAlert(err,'Please enter username and password.');return;}
  const user=DB.users.find(x=>x.username===u&&x.password===p);
  if(!user){showAlert(err,'Invalid username or password.');return;}
  if(user.status==='Pending'){showAlert(err,'Your account is pending admin approval. Please wait.');return;}
  if(user.status==='Suspended'){showAlert(err,'Your account has been suspended. Contact admin.');return;}
  user.lastLogin=new Date().toLocaleString();
  currentUser=user;
  if(user.role==='Patient')currentPatient=getPatientByUserId(user.id);
  checkReminders();
  initApp();
}

function doRegister() {
  const fname = document.getElementById('r-fname').value.trim();
  const lname = document.getElementById('r-lname').value.trim();
  const uname = document.getElementById('r-user').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const pass = document.getElementById('r-pass').value;
  const contact = document.getElementById('r-contact').value.trim();
  const ptype = document.getElementById('r-ptype').value;
  const college = ptype === 'Student' ? document.getElementById('r-college').value : '';
  const idNo = document.getElementById('r-idno').value.trim();
  const fileInput = document.getElementById('r-id-file');
  const err = document.getElementById('reg-err');
  const ok = document.getElementById('reg-ok');
  hideAlert(err); hideAlert(ok);

  if (!fname || !lname || !uname || !email || !pass) {
    showAlert(err, 'Name, username, email and password are required.');
    return;
  }
  if (!fileInput.files.length) {
    showAlert(err, 'Please upload your School ID or COR.');
    return;
  }
  if (DB.users.find(x => x.username === uname)) {
    showAlert(err, 'Username already taken.');
    return;
  }
  if (DB.users.find(x => x.email === email)) {
    showAlert(err, 'Email already registered.');
    return;
  }

  const file = fileInput.files[0];
  const reader = new FileReader();
  reader.onload = function(ev) {
    const fileDataUrl = ev.target.result; 
    const uid = DB.nextUserId++;
    const newUser = {
      id: uid, fname, lname, username: uname, password: pass, role: 'Patient',
      email, contact, status: 'Pending', college, personType: ptype, idNo,
      idFile: file.name,          
      idFileData: fileDataUrl,    
      verified: false, createdAt: TODAY, lastLogin: ''
    };
    DB.users.push(newUser);
    addNotif(1, 'New Registration Request', `${fname} ${lname} (${ptype}) has submitted a registration request.`, 'info');

function saveArticle(id) {
  const title = document.getElementById('art-title').value.trim();
  const category = document.getElementById('art-category').value;
  const content = document.getElementById('art-content').value.trim();
  const published = document.getElementById('art-published').checked;
  if (!title || !content) { toast('Title and content are required.', 'error'); return; }
  if (id) {
    const idx = DB.healthResources.findIndex(r => r.id === id);
    if (idx !== -1) {
      DB.healthResources[idx] = { ...DB.healthResources[idx], title, category, content, published };
      toast('Article updated.', 'success');
    }
  } else {
    DB.healthResources.push({
      id: DB.nextResourceId++,
      title, category, content,
      authorId: currentUser.id,
      createdAt: TODAY,
      published
    });
    toast('Article added.', 'success');
  }
  closeAllModals();
  renderHealthEducation();
}

// Helper to escape HTML (prevent XSS)
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
    return c;
  });
}
function getUserName(id) {
  const u = DB.users.find(u => u.id === id);
  return u ? `${u.fname} ${u.lname}` : 'System';
}

function filterMyAppts(f,el){
  document.querySelectorAll('#app-content .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const pt=currentPatient;
  const appts=DB.appointments.filter(a=>a.patientId===pt.id);
  renderMyApptsList(appts,f);
}

function renderMyApptsList(appts,filter){
  const el=document.getElementById('my-appts-list');
  if(!el)return;
  let list=appts;
  if(filter!=='all')list=appts.filter(a=>a.status===filter);
  list=list.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!list.length){el.innerHTML='<div class="empty-state"><p>No appointments found.</p></div>';return;}
  el.innerHTML=`<div class="table-wrap"><table><thead><tr><th>#</th><th>Clinic</th><th>Service</th><th>Date</th><th>Time</th><th>Doctor</th><th>Status</th><th>Actions</th></tr></thead><tbody>${
    list.map(a=>{
      const doc=getUserById(a.doctorId);
      const canCancel=a.status==='Scheduled'&&a.date>=TODAY;
      const canReschedule=a.status==='Scheduled'&&a.date>TODAY;
      return`<tr>
        <td>#${a.id}</td><td>${a.clinic}</td><td>${a.service}</td>
        <td>${fmtDate(a.date)}</td><td>${fmtTime(a.time)}</td>
        <td>Dr. ${doc?doc.lname:'Unknown'}</td>
        <td>${statusBadge(a.status)}</td>
        <td><div class="td-actions">
          ${canReschedule?`<button class="btn btn-xs btn-info" onclick="openRescheduleModal(${a.id})">Reschedule</button>`:''}
          ${canCancel?`<button class="btn btn-xs btn-danger" onclick="cancelAppt(${a.id},true)">Cancel</button>`:''}
          ${a.status==='Completed'?`<button class="btn btn-xs" onclick="viewTreatmentForAppt(${a.id})">View Notes</button>`:''}
        </div></td>
      </tr>`;
    }).join('')
  }</tbody></table></div>`;
}

function saveAccount(){
  const u=currentUser;
  u.fname=document.getElementById('acc-fname').value.trim()||u.fname;
  u.lname=document.getElementById('acc-lname').value.trim()||u.lname;
  u.email=document.getElementById('acc-email').value.trim()||u.email;
  u.contact=document.getElementById('acc-contact').value.trim();
  document.getElementById('sb-name').textContent=`${u.fname} ${u.lname}`;
  document.getElementById('sb-avatar').textContent=(u.fname[0]+u.lname[0]).toUpperCase();
  const msg=document.getElementById('acc-msg');
  showAlert(msg,'Profile updated successfully.','success');
  setTimeout(()=>hideAlert(msg),3000);
  toast('Profile updated.','success');
}

function changePassword(){
  const u=currentUser;
  const cur=document.getElementById('pw-cur').value;
  const nw=document.getElementById('pw-new').value;
  const conf=document.getElementById('pw-conf').value;
  const msg=document.getElementById('pw-msg');
  hideAlert(msg);
  if(cur!==u.password){showAlert(msg,'Current password is incorrect.');return;}
  if(!nw||nw.length<6){showAlert(msg,'New password must be at least 6 characters.');return;}
  if(nw!==conf){showAlert(msg,'Passwords do not match.');return;}
  u.password=nw;
  showAlert(msg,'Password changed successfully.','success');
  ['pw-cur','pw-new','pw-conf'].forEach(id=>document.getElementById(id).value='');
  toast('Password updated.','success');
}

function saveScheduleSettings(){
  const u=currentUser;
  u.startTime=document.getElementById('sch-start').value;
  u.endTime=document.getElementById('sch-end').value;
  u.slotDuration=parseInt(document.getElementById('sch-slot').value)||60;
  u.maxPatients=parseInt(document.getElementById('sch-max').value)||20;
  u.workDays=Array.from(document.querySelectorAll('[value="Mon"],[value="Tue"],[value="Wed"],[value="Thu"],[value="Fri"],[value="Sat"],[value="Sun"]')).filter(cb=>cb.type==='checkbox'&&cb.checked).map(cb=>cb.value);
  const msg=document.getElementById('sched-msg');
  showAlert(msg,'Schedule settings saved.','success');
  setTimeout(()=>hideAlert(msg),3000);
  toast('Schedule updated.','success');
}

function renderApptTable(){
  const q=(document.getElementById('appt-search')||{}).value||'';
  const stat=(document.getElementById('appt-status')||{}).value||'';
  const col=(document.getElementById('appt-college')||{}).value||'';
  const clinic=(document.getElementById('appt-clinic')||{}).value||'';
  const date=(document.getElementById('appt-date')||{}).value||'';
  const role=currentUser.role;
  let appts=DB.appointments.filter(a=>{
    const pt=getPatientById(a.patientId);
    const name=pt?`${pt.fname} ${pt.lname}`.toLowerCase():'';
    const matchQ=!q||name.includes(q.toLowerCase())||a.clinic.toLowerCase().includes(q.toLowerCase());
    const matchS=!stat||a.status===stat;
    const matchC=!col||a.college===col;
    const matchCl=!clinic||a.clinic===clinic;
    const matchD=!date||a.date===date;
    const matchDoc=role!=='Doctor'||a.doctorId===currentUser.id;
    return matchQ&&matchS&&matchC&&matchCl&&matchD&&matchDoc;
  });
  appts=appts.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const el=document.getElementById('appt-table');
  if(!el)return;
  const canManage=role==='Staff'||role==='Administrator';
  const isDoc=role==='Doctor';
  if(!appts.length){el.innerHTML='<div class="empty-state"><p>No appointments found.</p></div>';return;}
  el.innerHTML=`<div class="table-wrap"><table><thead><tr><th>#</th><th>Patient</th><th>College</th><th>Priority</th><th>Clinic</th><th>Date & Time</th><th>Doctor</th><th>Status</th><th>Actions</th></tr></thead><tbody>${
    appts.map(a=>{
      const pt=getPatientById(a.patientId);
      const doc=getUserById(a.doctorId);
      const canCancel=a.status==='Scheduled';
      return`<tr>
        <td>#${a.id}</td>
        <td><strong>${pt?pt.fname+' '+pt.lname:'Unknown'}</strong></td>
        <td>${collegeBadge(a.college)}</td><td>${priorityBadge(a.priority)}</td>
        <td>${a.clinic}</td>
        <td>${fmtDate(a.date)}<br><span class="text-muted">${fmtTime(a.time)}</span></td>
        <td>Dr. ${doc?doc.lname:'?'}</td>
        <td>${statusBadge(a.status)}</td>
        <td><div class="td-actions">
          <button class="btn btn-xs" onclick="viewAppt(${a.id})">View</button>
          ${canManage&&canCancel?`<button class="btn btn-xs btn-warning" onclick="openRescheduleModal(${a.id})">Reschedule</button>`:''}
          ${(canManage||isDoc)&&a.status==='Scheduled'?`<button class="btn btn-xs btn-success" onclick="completeAppt(${a.id})">Complete</button>`:''}
          ${isDoc&&a.status==='Scheduled'?`<button class="btn btn-xs btn-primary" onclick="openAddTreatmentModal(${a.id})">Notes</button>`:''}
          ${canManage&&canCancel?`<button class="btn btn-xs btn-danger" onclick="cancelAppt(${a.id})">Cancel</button>`:''}
          ${currentUser.role==='Administrator'&&a.status==='Scheduled'?`<button class="btn btn-xs" onclick="noShowAppt(${a.id})">No-show</button>`:''}
          ${canManage?`<button class="btn btn-xs btn-info" onclick="sendApptNotif(${a.id})">Notify</button>`:''}
        </div></td>
      </tr>`;
    }).join('')
  }</tbody></table></div>`;
}

function completeAppt(id){
  const a=DB.appointments.find(x=>x.id===id);
  if(!a)return;
  a.status='Completed';
  const pt=getPatientById(a.patientId);
  if(pt){
    const u=DB.users.find(x=>x.id===pt.userId);
    if(u)addNotif(u.id,'Appointment Completed',`Your ${a.clinic} appointment on ${fmtDate(a.date)} has been marked complete.`,'success');
  }
  toast('Appointment marked as completed.','success');
  renderApptTable();
  if(document.getElementById('my-appts-list'))filterMyAppts('all',document.querySelector('#app-content .tab'));
}

function noShowAppt(id){
  const a=DB.appointments.find(x=>x.id===id);
  if(a){a.status='No-show';toast('Marked as no-show.','warning');renderApptTable();}
}

function cancelAppt(id,patient=false){
  if(!confirm('Cancel this appointment?'))return;
  const a=DB.appointments.find(x=>x.id===id);
  if(!a)return;
  a.status='Cancelled';
  const pt=getPatientById(a.patientId);
  if(pt){
    const u=DB.users.find(x=>x.id===pt.userId);
    if(u)addNotif(u.id,'Appointment Cancelled',`Your ${a.clinic} appointment on ${fmtDate(a.date)} has been cancelled.`,'danger');
  }
  toast('Appointment cancelled.','warning');
  if(patient)renderMyAppointments();
  else renderApptTable();
}

function sendApptNotif(id){
  const a=DB.appointments.find(x=>x.id===id);
  const pt=getPatientById(a.patientId);
  if(!pt)return;
  const u=DB.users.find(x=>x.id===pt.userId);
  if(u){addNotif(u.id,'Appointment Reminder',`Reminder: You have a ${a.clinic} appointment on ${fmtDate(a.date)} at ${fmtTime(a.time)}.`,'warning');}
  toast(`Notification sent to ${pt.fname} ${pt.lname}.`,'success');
}

function approveUser(id){
  const u=DB.users.find(x=>x.id===id);
  if(!u)return;
  u.status='Active';u.verified=true;
  if(u.role==='Patient'){
    const exists=DB.patients.find(p=>p.userId===id);
    if(!exists){
      DB.patients.push({id:DB.nextPatientId++,userId:id,fname:u.fname,lname:u.lname,age:0,gender:'Unknown',blood:'Unknown',address:'',college:u.college,personType:u.personType,idNo:u.idNo,height:'',weight:'',emergencyContact:'',emergencyName:'',medHistory:'',allergies:'',createdAt:TODAY});
    }
  }
  addNotif(id,'Account Approved!','Your CampusCare account has been approved. You can now login.','success');
  toast(`${u.fname} ${u.lname} approved.`,'success');
  renderApprovals();
}

function rejectUser(id){
  const reason=prompt('Reason for rejection (optional):');
  const u=DB.users.find(x=>x.id===id);
  if(!u)return;
  u.status='Suspended';
  addNotif(id,'Registration Rejected',`Your registration was not approved. ${reason?'Reason: '+reason:'Please contact the clinic for details.'}` ,'danger');
  toast(`${u.fname} ${u.lname} rejected.`,'warning');
  renderApprovals();
}

function renderMessages() {

  } else if (role === 'Doctor') {
    conversations = DB.messages.filter(m => m.toUserId === currentUser.id || m.fromUserId === currentUser.id)
      .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  }
  
  const c = document.getElementById('app-content');
  c.innerHTML = `
    <div class="card">
      <div class="card-header">

        ${role === 'Patient' ? `<button class="btn btn-primary btn-sm" onclick="openNewMessageModal()">+ New Message</button>` : ''}
      </div>
      <div id="msg-list">
        ${conversations.length ? conversations.map(m => `
          <div class="msg-item" style="border-bottom:1px solid #ebe8e0; padding:.6rem; cursor:pointer" onclick="viewMessageThread(${m.id})">
            <div><strong>${m.fromUserId === currentUser.id ? 'You → ' + getUserName(m.toUserId) : getUserName(m.fromUserId) + ' → You'}</strong> · <span class="text-muted">${fmtDateTime(m.createdAt)}</span></div>

      </div>

  `;

function openNewMessageModal(recipientId = null) {
  const doctors = getDoctors();
  const patientList = DB.patients.map(p => ({ id: p.userId, name: p.fname + ' ' + p.lname }));
  const recipients = currentUser.role === 'Patient' ? doctors : patientList;
  openModal(`
    <div class="modal">
      <div class="modal-header"><h3>New Message</h3><button class="close-btn" onclick="closeAllModals()">✕</button></div>
      <div class="modal-body">
        <div id="msg-err"></div>
        <div class="form-group"><label>To</label>
          <select id="msg-to">${recipients.map(r => `<option value="${r.id}">${r.name || r.fname + ' ' + r.lname}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label>Subject</label><input id="msg-subj" placeholder="Brief topic"></div>
        <div class="form-group"><label>Message</label><textarea id="msg-body" rows="4" placeholder="Type your question/comment..."></textarea></div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeAllModals()">Cancel</button>
        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
      </div>
    </div>
  `);
}

function sendMessage() {
  const toId = parseInt(document.getElementById('msg-to').value);
  const subject = document.getElementById('msg-subj').value.trim();
  const body = document.getElementById('msg-body').value.trim();
  if (!subject || !body) { toast('Subject and message cannot be empty.', 'error'); return; }
  DB.messages.push({
    id: DB.nextMessageId++,
    fromUserId: currentUser.id,
    toUserId: toId,
    subject,
    message: body,
    createdAt: new Date().toLocaleString(),
    isRead: false,
    replyToId: null
  });
  addNotif(toId, 'New Message', `You have a new message from ${currentUser.fname} ${currentUser.lname}: ${subject}`, 'info');
  closeAllModals();
  toast('Message sent.', 'success');
  renderMessages();
}

function viewMessageThread(initialMsgId) {
  const msg = DB.messages.find(m => m.id === initialMsgId);
  if (!msg) return;
  // Mark as read if recipient is current user
  if (msg.toUserId === currentUser.id && !msg.isRead) {
    msg.isRead = true;
    updateNotifUI();
  }
  // Gather all messages between these two users (simple conversation)
  const allMsgs = DB.messages.filter(m => 
    (m.fromUserId === msg.fromUserId && m.toUserId === msg.toUserId) ||
    (m.fromUserId === msg.toUserId && m.toUserId === msg.fromUserId)
  ).sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
  
  openModal(`
    <div class="modal modal-lg">
      <div class="modal-header"><h3>Conversation with ${getUserName(msg.fromUserId === currentUser.id ? msg.toUserId : msg.fromUserId)}</h3><button class="close-btn" onclick="closeAllModals()">✕</button></div>
      <div class="modal-body" style="max-height:60vh; overflow-y:auto">
        ${allMsgs.map(m => `
          <div style="margin-bottom:1rem; padding:.5rem; background:${m.fromUserId === currentUser.id ? '#f0f7ff' : '#fff'}; border-radius:8px">
            <div><strong>${getUserName(m.fromUserId)}</strong> · <span class="text-muted">${fmtDateTime(m.createdAt)}</span></div>
            <div><strong>${escapeHtml(m.subject)}</strong></div>
            <div style="white-space:pre-wrap">${escapeHtml(m.message)}</div>
          </div>
        `).join('')}
        <div class="divider"></div>
        <div class="form-group"><label>Reply</label><textarea id="reply-body" rows="2" placeholder="Write your reply..."></textarea></div>
        <button class="btn btn-primary btn-sm" onclick="sendReply(${msg.fromUserId}, ${msg.toUserId}, 'RE: ${escapeHtml(msg.subject)}')">Send Reply</button>
      </div>
    </div>
  `);
}

function sendReply(otherUserId, myId, subjectPrefix) {
  const replyBody = document.getElementById('reply-body')?.value.trim();
  if (!replyBody) { toast('Reply cannot be empty.', 'error'); return; }
  DB.messages.push({
    id: DB.nextMessageId++,
    fromUserId: currentUser.id,
    toUserId: otherUserId === currentUser.id ? myId : otherUserId,
    subject: subjectPrefix,
    message: replyBody,
    createdAt: new Date().toLocaleString(),
    isRead: false,
    replyToId: null
  });
  addNotif(otherUserId, 'New Message Reply', `${currentUser.fname} replied to your message.`, 'info');
  closeAllModals();
  toast('Reply sent.', 'success');
  renderMessages();
}

function renderInvTable(){
  const q=(document.getElementById('inv-search')||{}).value||'';
  const cat=(document.getElementById('inv-cat')||{}).value||'';
  const stock=(document.getElementById('inv-stock')||{}).value||'';
  let items=DB.inventory.filter(i=>{
    const mQ=!q||i.name.toLowerCase().includes(q.toLowerCase());
    const mC=!cat||i.category===cat;
    const mS=!stock||(stock==='low'?i.qty<=i.threshold:i.qty>i.threshold);
    return mQ&&mC&&mS;
  });
  const el=document.getElementById('inv-table');
  if(!el)return;
  const canEdit=currentUser.role==='Staff'||currentUser.role==='Administrator';
  if(!items.length){el.innerHTML='<div class="empty-state"><p>No items found.</p></div>';return;}
  el.innerHTML=`<div class="table-wrap"><table><thead><tr><th>#</th><th>Item</th><th>Category</th><th>Qty</th><th>Threshold</th><th>Unit Cost</th><th>Expiry</th><th>Disburse Date</th><th>Stock</th><th>Actions</th></tr></thead><tbody>${
    items.map(i=>{
      const pct=Math.min(100,Math.round(i.qty/Math.max(i.threshold*2,1)*100));
      const lvl=i.qty<=i.threshold?'Low':i.qty<=i.threshold*1.5?'Medium':'Good';
      const bdg=i.qty<=i.threshold?'badge-danger':i.qty<=i.threshold*1.5?'badge-warning':'badge-success';
      const daysToDisb=i.disbursementDate?(Math.ceil((new Date(i.disbursementDate)-new Date(TODAY))/(1000*60*60*24))):'';
      const disbWarn=daysToDisb!==''&&daysToDisb<=7&&daysToDisb>=0;
      return`<tr ${i.qty<=i.threshold?'style="background:#fffbf5"':''}>
        <td>#${i.id}</td>
        <td><strong>${i.name}</strong><br><span class="text-muted">${i.supplier||''}</span></td>
        <td><span class="badge badge-gray">${i.category}</span></td>
        <td><strong>${i.qty}</strong> ${i.unit}</td>
        <td>${i.threshold} ${i.unit}</td>
        <td>₱${(i.unitCost||0).toFixed(2)}</td>
        <td class="${i.expiryDate&&i.expiryDate<=TODAY?'text-danger':''}">${fmtDate(i.expiryDate)}</td>
        <td class="${disbWarn?'text-warning':''}"><strong>${fmtDate(i.disbursementDate)}</strong>${disbWarn?` <span class="badge badge-warning">In ${daysToDisb}d</span>`:''}</td>
        <td><span class="badge ${bdg}">${lvl}</span><div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${i.qty<=i.threshold?'#E24B4A':i.qty<=i.threshold*1.5?'#EF9F27':'#639922'}"></div></div></td>
        <td><div class="td-actions">
          ${canEdit?`<button class="btn btn-xs btn-info" onclick="openUpdateQtyModal(${i.id})">Update Qty</button>
          <button class="btn btn-xs" onclick="openInvModal(${i.id})">Edit</button>
          ${currentUser.role==='Administrator'?`<button class="btn btn-xs btn-danger" onclick="deleteInv(${i.id})">Delete</button>`:''}
          `:''}
        </div></td>
      </tr>`;
    }).join('')
  }</tbody></table></div>`;
}

  const el=document.getElementById('disb-table');

  const c=document.getElementById('app-content');
  c.innerHTML=`
    <div class="card">
      <div class="card-header"><h3>Generate Report</h3></div>
      <div class="form-row">
        <div class="form-group"><label>Report Type</label>
          <select id="rpt-type">
            <option value="appointments">Appointments</option>
            <option value="treatments">Treatments</option>
            <option value="inventory">Inventory</option>
            <option value="patients">Patients</option>
          </select>
        </div>
        <div class="form-group"><label>Date From</label><input type="date" id="rpt-from" value="${TODAY.substring(0,7)+'-01'}"></div>
        <div class="form-group"><label>Date To</label><input type="date" id="rpt-to" value="${TODAY}"></div>
        <div class="form-group"><label>College</label>
          <select id="rpt-college"><option value="">All Colleges</option>${['CCICT','COE','COED','CME','CAS','COT'].map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        </div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="generateReport()">Generate Report</button>
    </div>
    <div id="rpt-result"></div>`;
}

function generateReport(){
  const type=document.getElementById('rpt-type').value;
  const from=document.getElementById('rpt-from').value;
  const to=document.getElementById('rpt-to').value;
  const college=document.getElementById('rpt-college').value;
  if(!from||!to){toast('Select a date range.','error');return;}
  if(from>to){toast('From date must be before To date.','error');return;}
  const el=document.getElementById('rpt-result');

  if(type==='appointments'){
    let data=DB.appointments.filter(a=>a.date>=from&&a.date<=to&&(!college||a.college===college));
    el.innerHTML=`<div class="card"><div class="card-header"><h3>Appointment Report – ${fmtDate(from)} to ${fmtDate(to)}</h3></div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-val">${data.length}</div><div class="stat-lbl">Total</div></div>
        <div class="stat-card"><div class="stat-val text-primary">${data.filter(a=>a.status==='Scheduled').length}</div><div class="stat-lbl">Scheduled</div></div>
        <div class="stat-card"><div class="stat-val text-success">${data.filter(a=>a.status==='Completed').length}</div><div class="stat-lbl">Completed</div></div>
        <div class="stat-card"><div class="stat-val text-danger">${data.filter(a=>a.status==='Cancelled').length}</div><div class="stat-lbl">Cancelled</div></div>
        <div class="stat-card"><div class="stat-val">${data.filter(a=>a.clinic==='Dental Clinic').length}</div><div class="stat-lbl">Dental</div></div>
        <div class="stat-card"><div class="stat-val">${data.filter(a=>a.clinic==='Medical Clinic').length}</div><div class="stat-lbl">Medical</div></div>
      </div>
      ${data.length?`<div class="table-wrap"><table><thead><tr><th>#</th><th>Patient</th><th>College</th><th>Clinic</th><th>Date</th><th>Doctor</th><th>Status</th></tr></thead><tbody>${data.map(a=>{const pt=getPatientById(a.patientId);const doc=getUserById(a.doctorId);return`<tr><td>#${a.id}</td><td>${pt?pt.fname+' '+pt.lname:'?'}</td><td>${collegeBadge(a.college)}</td><td>${a.clinic}</td><td>${fmtDate(a.date)}</td><td>Dr.${doc?doc.lname:'?'}</td><td>${statusBadge(a.status)}</td></tr>`;}).join('')}</tbody></table></div>`:'<div class="empty-state"><p>No records found.</p></div>'}
    </div>`;
  }else if(type==='treatments'){
    let data=DB.treatments.filter(t=>t.date>=from&&t.date<=to);
    if(college)data=data.filter(t=>{const pt=getPatientById(t.patientId);return pt&&pt.college===college;});
    el.innerHTML=`<div class="card"><div class="card-header"><h3>Treatment Report</h3></div>
      <div class="stats-grid"><div class="stat-card"><div class="stat-val">${data.length}</div><div class="stat-lbl">Total Treatments</div></div></div>
      ${data.length?`<div class="table-wrap"><table><thead><tr><th>#</th><th>Patient</th><th>Diagnosis</th><th>Doctor</th><th>Date</th><th>Follow-up</th></tr></thead><tbody>${data.map(t=>{const pt=getPatientById(t.patientId);const doc=getUserById(t.doctorId);return`<tr><td>#${t.id}</td><td>${pt?pt.fname+' '+pt.lname:'?'}</td><td>${t.diagnosis}</td><td>Dr.${doc?doc.lname:'?'}</td><td>${fmtDate(t.date)}</td><td>${fmtDate(t.followupDate)}</td></tr>`;}).join('')}</tbody></table></div>`:'<div class="empty-state"><p>No records found.</p></div>'}
    </div>`;
  }else if(type==='inventory'){
    const low=getLowStock();
    const total=DB.inventory.reduce((s,i)=>s+i.qty,0);
    const val=DB.inventory.reduce((s,i)=>s+i.qty*(i.unitCost||0),0);
    el.innerHTML=`<div class="card"><div class="card-header"><h3>Inventory Report</h3></div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-val">${DB.inventory.length}</div><div class="stat-lbl">Total Items</div></div>
        <div class="stat-card"><div class="stat-val text-danger">${low.length}</div><div class="stat-lbl">Low Stock</div></div>
        <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-lbl">Total Units</div></div>
        <div class="stat-card"><div class="stat-val text-primary">₱${val.toFixed(2)}</div><div class="stat-lbl">Inventory Value</div></div>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Item</th><th>Category</th><th>Qty</th><th>Threshold</th><th>Value</th><th>Status</th></tr></thead><tbody>${DB.inventory.map(i=>{const bdg=i.qty<=i.threshold?'badge-danger':'badge-success';const lvl=i.qty<=i.threshold?'Low':'OK';return`<tr><td>${i.name}</td><td>${i.category}</td><td>${i.qty}</td><td>${i.threshold}</td><td>₱${(i.qty*(i.unitCost||0)).toFixed(2)}</td><td><span class="badge ${bdg}">${lvl}</span></td></tr>`;}).join('')}</tbody></table></div>
    </div>`;
  }else{
    let pts=DB.patients;
    if(college)pts=pts.filter(p=>p.college===college);
    const byCollege={};
    pts.forEach(p=>{byCollege[p.college||'Unknown']=(byCollege[p.college||'Unknown']||0)+1;});
    el.innerHTML=`<div class="card"><div class="card-header"><h3>Patient Report</h3></div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-val">${pts.length}</div><div class="stat-lbl">Total Patients</div></div>
        <div class="stat-card"><div class="stat-val">${pts.filter(p=>p.personType==='Student').length}</div><div class="stat-lbl">Students</div></div>
        <div class="stat-card"><div class="stat-val">${pts.filter(p=>p.personType==='Teaching Personnel').length}</div><div class="stat-lbl">Teaching</div></div>
        <div class="stat-card"><div class="stat-val">${pts.filter(p=>p.personType==='Non-Teaching Personnel').length}</div><div class="stat-lbl">Non-Teaching</div></div>
      </div>
      <div style="margin-bottom:.75rem"><strong style="font-size:.83rem">By College:</strong> ${Object.entries(byCollege).map(([k,v])=>`${collegeBadge(k)} ${v}`).join(' &nbsp; ')}</div>
      ${pts.length?`<div class="table-wrap"><table><thead><tr><th>Name</th><th>College</th><th>Type</th><th>Age</th><th>Blood</th></tr></thead><tbody>${pts.map(p=>`<tr><td>${p.fname} ${p.lname}</td><td>${collegeBadge(p.college)}</td><td>${priorityBadge(p.personType)}</td><td>${p.age}</td><td>${p.blood}</td></tr>`).join('')}</tbody></table></div>`:''}
    </div>`;
  }
}

function renderUsers(){
  const c=document.getElementById('app-content');
  c.innerHTML=`
    <div class="toolbar">
      <input type="text" placeholder="Search users..." id="usr-search" oninput="renderUserTable()">
      <select id="usr-role" onchange="renderUserTable()">
        <option value="">All Roles</option>
        <option>Administrator</option><option>Doctor</option><option>Staff</option><option>Patient</option>
      </select>
      <select id="usr-status" onchange="renderUserTable()">
        <option value="">All Status</option>
        <option>Active</option><option>Pending</option><option>Suspended</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="openAddUserModal()">+ Add User</button>
    </div>
    <div class="card"><div id="user-table"></div></div>`;
  renderUserTable();
}

function renderUserTable(){
  const q=(document.getElementById('usr-search')||{}).value||'';
  const role=(document.getElementById('usr-role')||{}).value||'';
  const stat=(document.getElementById('usr-status')||{}).value||'';
  let users=DB.users.filter(u=>{
    const name=`${u.fname} ${u.lname} ${u.username} ${u.email}`.toLowerCase();
    return (!q||name.includes(q.toLowerCase()))&&(!role||u.role===role)&&(!stat||u.status===stat);
  });
  const el=document.getElementById('user-table');
  if(!el)return;
  el.innerHTML=`<div class="table-wrap"><table><thead><tr><th>#</th><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Type/Dept</th><th>Last Login</th><th>Status</th><th>Actions</th></tr></thead><tbody>${
    users.map(u=>`<tr>
      <td>${u.id}</td>
      <td><strong>${u.fname} ${u.lname}</strong><br><span class="text-muted">${u.idNo||''}</span></td>
      <td>${u.username}</td><td style="font-size:.78rem">${u.email}</td>
      <td><span class="badge badge-info">${u.role}</span></td>
      <td>${u.personType||u.specialty||u.department||'-'}<br>${collegeBadge(u.college)}</td>
      <td class="text-muted">${u.lastLogin||'Never'}</td>
      <td>${statusBadge(u.status)}</td>
      <td><div class="td-actions">
        <button class="btn btn-xs" onclick="openEditUserModal(${u.id})">Edit</button>
        ${u.status==='Active'?`<button class="btn btn-xs btn-warning" onclick="suspendUser(${u.id})">Suspend</button>`:''}
        ${u.status==='Pending'?`<button class="btn btn-xs btn-success" onclick="approveUser(${u.id})">Approve</button><button class="btn btn-xs btn-danger" onclick="rejectUser(${u.id})">Reject</button>`:''}
        ${u.status==='Suspended'?`<button class="btn btn-xs btn-success" onclick="reactivateUser(${u.id})">Reactivate</button>`:''}
        ${u.id!==currentUser.id?`<button class="btn btn-xs btn-danger" onclick="deleteUser(${u.id})">Delete</button>`:''}
      </div></td>
    </tr>`).join('')
  }</tbody></table></div>`;
}

function suspendUser(id){
  if(!confirm('Suspend this user?'))return;
  const u=DB.users.find(x=>x.id===id);
  if(u){u.status='Suspended';toast('User suspended.','warning');renderUserTable();}
}
function reactivateUser(id){
  const u=DB.users.find(x=>x.id===id);
  if(u){u.status='Active';toast('User reactivated.','success');renderUserTable();}
}
function deleteUser(id){
  if(!confirm('Permanently delete this user?'))return;
  DB.users=DB.users.filter(u=>u.id!==id);
  toast('User deleted.','warning');renderUserTable();
}

function openModal(html){
  closeAllModals();
  const wrap=document.createElement('div');
  wrap.className='overlay show';
  wrap.id='active-modal';
  wrap.innerHTML=html;
  wrap.addEventListener('click',e=>{if(e.target===wrap)closeAllModals();});
  document.getElementById('modals').appendChild(wrap);
  activeModal=wrap;
}
function closeAllModals(){
  document.getElementById('modals').innerHTML='';
  activeModal=null;
}

function showFilePreview(fileName, fileDataUrl) {
  const isImage = fileDataUrl && fileDataUrl.startsWith('data:image');
  const modalContent = `
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3>Document: ${fileName}</h3>
        <button class="close-btn" onclick="closeAllModals()">✕</button>
      </div>
      <div class="modal-body" style="text-align:center">
        ${isImage
          ? `<img src="${fileDataUrl}" style="max-width:100%; max-height:70vh; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1);" alt="ID/COR">`
          : `<div class="alert alert-info">This file is not an image. <a href="${fileDataUrl}" download="${fileName}" target="_blank" class="btn btn-primary btn-sm" style="margin-top:1rem">Download file</a></div>`
        }
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeAllModals()">Close</button>
      </div>
    </div>
  `;
  openModal(modalContent);
}

// ── Book Appointment ──
function openBookApptModal(apptId=null){
  const editing=apptId?DB.appointments.find(a=>a.id===apptId):null;
  const isPt=currentUser.role==='Patient';
  const pt=isPt?currentPatient:null;
  const patientOptions=isPt?`<option value="${pt?pt.id:''}">${pt?pt.fname+' '+pt.lname:'No record'}</option>`:
    DB.patients.map(p=>`<option value="${p.id}" ${editing&&editing.patientId===p.id?'selected':''}>${p.fname} ${p.lname} (${p.college})</option>`).join('');
  const doctorOptions=getDoctors().map(d=>`<option value="${d.id}" data-specialty="${d.specialty||'General'}" ${editing&&editing.doctorId===d.id?'selected':''}>${d.fname} ${d.lname} – ${d.specialty||'General'}</option>`).join('');
  openModal(`<div class="modal">
    <div class="modal-header"><h3>${editing?'Reschedule':'Book'} Appointment</h3><button class="close-btn" onclick="closeAllModals()">✕</button></div>
    <div class="modal-body">
      <div id="book-msg"></div>
      <div id="dental-warn" class="alert alert-warning"></div>
      <div class="form-row">
        <div class="form-group ${isPt?'full':''}"><label>Patient <span class="required">*</span></label>
          <select id="b-pt" ${isPt?'disabled':''}>${patientOptions}</select>
        </div>
        ${!isPt?`<div class="form-group"><label>Priority</label>
          <select id="b-priority"><option>Student</option><option>Teaching</option><option>Non-Teaching</option></select>
        </div>`:''}
      </div>
      <div class="form-row">
        <div class="form-group"><label>Clinic <span class="required">*</span></label>
          <select id="b-clinic" onchange="onClinicChange()"${isPt?' ':''}>
            <option value="Medical Clinic" ${editing&&editing.clinic==='Medical Clinic'?'selected':''}>Medical Clinic</option>
            <option value="Dental Clinic" ${editing&&editing.clinic==='Dental Clinic'?'selected':''}>Dental Clinic</option>
          </select>
        </div>
        <div class="form-group"><label>Service <span class="required">*</span></label>
          <select id="b-service">
            <option>General Checkup</option><option>Follow-up</option><option>Consultation</option><option>Physical Exam</option>
            <option>Dental Checkup</option><option>Tooth Extraction</option><option>Dental Cleaning</option><option>Dental X-ray</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Doctor <span class="required">*</span></label>
          <select id="b-doc" onchange="loadTimeSlots()">${doctorOptions}</select>
        </div>
        <div class="form-group"><label>Date <span class="required">*</span></label>
          <input type="date" id="b-date" min="${TODAY}" value="${editing?editing.date:''}" onchange="loadTimeSlots()">
        </div>
      </div>
      <div class="form-group"><label>Available Time Slots</label>
        <div id="slot-grid" class="slot-grid" style="min-height:40px"><span class="text-muted" style="font-size:.78rem">Select a doctor and date to see available slots.</span></div>
        <input type="hidden" id="b-time" value="${editing?editing.time:''}">
      </div>
      <div class="form-group full"><label>Reason / Chief Complaint</label>
        <textarea id="b-reason" rows="2">${editing?editing.reason:''}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeAllModals()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAppt(${apptId||'null'})">Confirm Booking</button>
    </div>
  </div>`);
  if(editing)loadTimeSlots();
  onClinicChange();
  checkDentalWarn();
}

function onClinicChange(){
  const clinic=document.getElementById('b-clinic');
  const svc=document.getElementById('b-service');
  const doc=document.getElementById('b-doc');
  if(!clinic||!svc||!doc)return;
  const isDental=clinic.value==='Dental Clinic';
  const medSvcs=['General Checkup','Follow-up','Consultation','Physical Exam'];
  const dentSvcs=['Dental Checkup','Tooth Extraction','Dental Cleaning','Dental X-ray'];
  const svcs=isDental?dentSvcs:medSvcs;
  svc.innerHTML=svcs.map(s=>`<option>${s}</option>`).join('');
  const docs=isDental?getDentalDoctors():getMedDoctors();
  doc.innerHTML=docs.map(d=>`<option value="${d.id}">${d.fname} ${d.lname} – ${d.specialty}</option>`).join('');
  checkDentalWarn();
  loadTimeSlots();
}

function checkDentalWarn(){
  const clinicEl=document.getElementById('b-clinic');
  const ptEl=document.getElementById('b-pt');
  const warnEl=document.getElementById('dental-warn');
  if(!clinicEl||!ptEl||!warnEl)return;
  warnEl.classList.remove('show');
  if(clinicEl.value==='Dental Clinic'){
    const ptId=parseInt(ptEl.value);
    if(ptId&&checkDentalQuota(ptId)){
      warnEl.innerHTML='⚠️ This patient has already used their Dental Clinic quota for this semester. Booking will be blocked.';
      warnEl.classList.add('show');
    }
  }
}

function loadTimeSlots(){
  const docId=parseInt((document.getElementById('b-doc')||{}).value);
  const date=(document.getElementById('b-date')||{}).value;
  const grid=document.getElementById('slot-grid');
  if(!grid)return;
  if(!docId||!date){grid.innerHTML='<span class="text-muted" style="font-size:.78rem">Select doctor and date.</span>';return;}
  const doc=getUserById(docId);
  if(!doc){return;}
  const dayName=dayOfWeek(date);
  const workDays=doc.workDays||['Mon','Tue','Wed','Thu','Fri'];
  if(!workDays.includes(dayName)){grid.innerHTML=`<span class="text-muted" style="font-size:.78rem">Dr. ${doc.lname} does not work on ${dayName}s.</span>`;return;}
  const start=parseInt((doc.startTime||'08:00').split(':')[0]);
  const end=parseInt((doc.endTime||'17:00').split(':')[0]);
  const dur=doc.slotDuration||60;
  const slots=[];
  for(let h=start;h<end;h+=(dur/60)){
    const hh=Math.floor(h);const mm=Math.round((h-hh)*60);
    slots.push(`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`);
  }
  const takenSlots=DB.appointments.filter(a=>a.doctorId===docId&&a.date===date&&a.status!=='Cancelled').map(a=>a.time);
  const selectedTime=(document.getElementById('b-time')||{}).value;
  grid.innerHTML=slots.map(s=>{
    const taken=takenSlots.includes(s);
    return`<div class="slot ${taken?'booked':selectedTime===s?'selected':''}" onclick="${taken?'':'selectSlot(\''+s+'\')'}">${fmtTime(s)}${taken?'<br><span style="font-size:.68rem">Taken</span>':''}</div>`;
  }).join('');
}

function selectSlot(t){
  const input=document.getElementById('b-time');
  if(input){input.value=t;}
  document.querySelectorAll('.slot:not(.booked)').forEach(s=>s.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
}

function saveAppt(editId){
  const ptId=parseInt(document.getElementById('b-pt').value);
  const clinic=document.getElementById('b-clinic').value;
  const svc=document.getElementById('b-service').value;
  const docId=parseInt(document.getElementById('b-doc').value);
  const date=document.getElementById('b-date').value;
  const time=document.getElementById('b-time').value;
  const reason=document.getElementById('b-reason').value.trim();
  const msg=document.getElementById('book-msg');
  hideAlert(msg);
  if(!ptId||!clinic||!svc||!docId||!date){showAlert(msg,'All required fields must be filled.');return;}
  if(!time){showAlert(msg,'Please select a time slot.');return;}
  if(date<TODAY){showAlert(msg,'Cannot book in the past.');return;}
  if(clinic==='Dental Clinic'&&checkDentalQuota(ptId,editId)){
    showAlert(msg,'Dental Clinic booking denied: Semester limit reached. Only 1 dental appointment per semester is allowed.');return;
  }
  const conflict=DB.appointments.find(a=>a.doctorId===docId&&a.date===date&&a.time===time&&a.status!=='Cancelled'&&a.id!==editId);
  if(conflict){showAlert(msg,'This time slot is already taken. Please select another.');return;}
  const pt=getPatientById(ptId);
  const priority=pt?pt.personType==='Student'?'Student':pt.personType==='Teaching Personnel'?'Teaching':'Non-Teaching':'Student';
  if(editId){
    const idx=DB.appointments.findIndex(a=>a.id===editId);
    if(idx>=0){DB.appointments[idx]={...DB.appointments[idx],clinic,service:svc,doctorId:docId,date,time,reason};}
    toast('Appointment rescheduled.','success');
  }else{
    const newId=DB.nextApptId++;
    DB.appointments.push({id:newId,patientId:ptId,doctorId:docId,clinic,service:svc,date,time,reason,status:'Scheduled',priority,college:pt?pt.college:'',createdBy:currentUser.id,notes:'',createdAt:TODAY});
    if(pt){const u=DB.users.find(x=>x.id===pt.userId);if(u)addNotif(u.id,'Appointment Confirmed',`Your ${clinic} appointment is confirmed for ${fmtDate(date)} at ${fmtTime(time)}.`,'success');}
    toast('Appointment booked!','success');
  }
  closeAllModals();
  // refresh
  if(currentUser.role==='Patient')renderMyAppointments();
  else renderApptTable&&renderApptTable();
  if(document.getElementById('appt-table'))renderApptTable();
}

function saveTreatment(ptId,apptId){
  const ptIdVal=ptId||parseInt(document.getElementById('tm-pt').value);
  const findings=document.getElementById('tm-findings').value.trim();
  const diag=document.getElementById('tm-diag').value.trim();
  const presc=document.getElementById('tm-presc').value.trim();
  const notes=document.getElementById('tm-notes').value.trim();
  const date=document.getElementById('tm-date').value;
  const followup=document.getElementById('tm-followup').value;
  const xray=document.getElementById('tm-xray').value;
  const msg=document.getElementById('trm-msg');
  const medName = document.getElementById('tm-medname')?.value.trim();
  const dosage = document.getElementById('tm-dosage')?.value.trim();
  const endDate = document.getElementById('tm-enddate')?.value;
  if(!ptIdVal||!diag||!date){showAlert(msg,'Patient, diagnosis and date are required.');return;}
  if(presc.length>600){showAlert(msg,'Prescription exceeds 600 characters.');return;}
  const vitals={bp:document.getElementById('tm-bp').value,temp:document.getElementById('tm-temp').value,pulse:document.getElementById('tm-pulse').value,spo2:document.getElementById('tm-spo2').value,weight:document.getElementById('tm-weight').value,height:document.getElementById('tm-height').value};
  const docId=currentUser.role==='Doctor'?currentUser.id:(getDoctors()[0]||{id:2}).id;
  DB.treatments.push({id:DB.nextTreatId++,patientId:ptIdVal,doctorId:docId,appointmentId:apptId,diagnosis:diag,prescription:presc,findings,notes,xray,vitals,date,followupDate:followup,createdAt:new Date().toLocaleString()});
  if(apptId){const a=DB.appointments.find(x=>x.id===apptId);if(a)a.status='Completed';}
  const pt=getPatientById(ptIdVal);
  if(pt){const u=DB.users.find(x=>x.id===pt.userId);if(u)addNotif(u.id,'Treatment Record Added',`Dr. ${currentUser.lname} has added treatment notes for your visit on ${fmtDate(date)}.`,'info');}
  toast('Treatment record saved.','success');
  if (medName && dosage && endDate) {
  DB.medReminders.push({
    id: DB.nextReminderId++,
    patientId: ptIdVal,
    medicationName: medName,
    dosage: dosage,
    startDate: TODAY,
    endDate: endDate,
    timeOfDay: ['08:00','14:00','20:00'], // default
    lastSent: null,
    status: 'active'
  });
  addNotif(pt.userId, 'Medication Reminder Added', `Dr. ${currentUser.lname} prescribed ${medName}. Take as directed.`, 'info');
}
  closeAllModals();
  if(document.getElementById('treat-table'))renderTreatTable();
  if(document.getElementById('my-appts-list'))renderMyAppointments();
}
