}

function saveInv(id){
  const name=document.getElementById('im-name').value.trim();
  const qty=parseInt(document.getElementById('im-qty').value);
  const thresh=parseInt(document.getElementById('im-thresh').value);
  const msg=document.getElementById('invm-msg');
  if(!name||isNaN(qty)||isNaN(thresh)){showAlert(msg,'Name, quantity and threshold are required.');return;}
  if(qty<0){showAlert(msg,'Quantity cannot be negative.');return;}
  const data={name,category:document.getElementById('im-cat').value,supplier:document.getElementById('im-supplier').value,qty,threshold:thresh,unit:document.getElementById('im-unit').value||'pcs',unitCost:parseFloat(document.getElementById('im-cost').value)||0,expiryDate:document.getElementById('im-expiry').value,disbursementDate:document.getElementById('im-disb').value};
  if(id){
    const idx=DB.inventory.findIndex(i=>i.id===id);
    if(idx>=0)DB.inventory[idx]={...DB.inventory[idx],...data};
    toast('Item updated.','success');
  }else{
    DB.inventory.push({id:DB.nextInvId++,...data});
    toast('Item added.','success');
  }
  if(data.qty<=data.threshold){
    DB.users.filter(u=>u.role==='Staff'||u.role==='Administrator').forEach(u=>addNotif(u.id,'Low Stock Alert',`${data.name} is below threshold (${data.qty} ${data.unit} remaining).`,'danger'));
  }
  closeAllModals();
  renderInvTable&&renderInvTable();
}

function openUpdateQtyModal(id){
  const it=DB.inventory.find(i=>i.id===id);if(!it)return;
  openModal(`<div class="modal modal-sm">
    <div class="modal-header"><h3>Update Quantity – ${it.name}</h3><button class="close-btn" onclick="closeAllModals()">✕</button></div>
    <div class="modal-body">
      <div class="alert alert-info show" style="font-size:.8rem">Current: <strong>${it.qty} ${it.unit}</strong> · Threshold: ${it.threshold}</div>
      <div class="form-group"><label>New Quantity <span class="required">*</span></label><input type="number" id="uq-qty" value="${it.qty}" min="0"></div>
      <div class="form-group"><label>Reason for Update</label><input id="uq-reason" placeholder="Restocked, consumed, etc."></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeAllModals()">Cancel</button>
      <button class="btn btn-primary" onclick="updateQty(${id})">Update</button>
    </div>
  </div>`);
}

function updateQty(id){
  const newQty=parseInt(document.getElementById('uq-qty').value);
  if(isNaN(newQty)||newQty<0){toast('Invalid quantity.','error');return;}
  const it=DB.inventory.find(i=>i.id===id);
  if(!it)return;
  it.qty=newQty;
  if(newQty<=it.threshold){
    DB.users.filter(u=>u.role==='Staff'||u.role==='Administrator').forEach(u=>addNotif(u.id,'Low Stock Alert',`${it.name} is now below threshold (${newQty} ${it.unit} remaining).`,'danger'));
  }
  toast(`${it.name} updated to ${newQty} ${it.unit}.`,'success');
  closeAllModals();
  renderInvTable&&renderInvTable();
}

function deleteInv(id){
  if(!confirm('Delete this inventory item?'))return;
  DB.inventory=DB.inventory.filter(i=>i.id!==id);
  toast('Item deleted.','warning');
  renderInvTable&&renderInvTable();
}

function openDisbursementModal(){
  openModal(`<div class="modal">
    <div class="modal-header"><h3>Record Item Disbursement</h3><button class="close-btn" onclick="closeAllModals()">✕</button></div>
    <div class="modal-body">
      <div id="disb-msg"></div>
      <div class="form-group"><label>Item <span class="required">*</span></label>
        <select id="disb-item">${DB.inventory.map(i=>`<option value="${i.id}">${i.name} (${i.qty} ${i.unit})</option>`).join('')}</select>
      </div>
      <div class="form-group"><label>Quantity to Disburse <span class="required">*</span></label><input type="number" id="disb-qty" min="1"></div>
      <div class="form-group"><label>Date</label><input type="date" id="disb-date" value="${TODAY}"></div>
      <div class="form-group"><label>Notes</label><input id="disb-notes" placeholder="e.g. Regular monthly disbursement"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeAllModals()">Cancel</button>
      <button class="btn btn-success" onclick="saveDisbursement()">Record Disbursement</button>
    </div>
  </div>`);
}

function saveDisbursement(){
  const itemId=parseInt(document.getElementById('disb-item').value);
  const qty=parseInt(document.getElementById('disb-qty').value);
  const date=document.getElementById('disb-date').value;
  const notes=document.getElementById('disb-notes').value;
  const msg=document.getElementById('disb-msg');
  const it=DB.inventory.find(i=>i.id===itemId);
  if(!it){showAlert(msg,'Item not found.');return;}
  if(!qty||qty<1){showAlert(msg,'Quantity must be at least 1.');return;}
  if(qty>it.qty){showAlert(msg,`Only ${it.qty} ${it.unit} available.`);return;}
  it.qty-=qty;
  DB.disbursements.push({id:DB.nextDisbId++,itemId,qty,date,notes,userId:currentUser.id});
  if(it.qty<=it.threshold){
    DB.users.filter(u=>u.role==='Staff'||u.role==='Administrator').forEach(u=>addNotif(u.id,'Low Stock After Disbursement',`${it.name} is now below threshold after disbursement.`,'danger'));
  }
  toast(`Disbursed ${qty} ${it.unit} of ${it.name}.`,'success');
  closeAllModals();
  renderInvTable&&renderInvTable();
  renderDisbTable&&renderDisbTable();
}

// ── Add User Modal ──
function openAddUserModal(){
  openModal(`<div class="modal">
    <div class="modal-header"><h3>Add New User</h3><button class="close-btn" onclick="closeAllModals()">✕</button></div>
    <div class="modal-body">
      <div id="adduser-msg"></div>
      <div class="form-row">
        <div class="form-group"><label>First Name <span class="required">*</span></label><input id="au-fname"></div>
        <div class="form-group"><label>Last Name <span class="required">*</span></label><input id="au-lname"></div>
        <div class="form-group"><label>Username <span class="required">*</span></label><input id="au-user"></div>
        <div class="form-group"><label>Email <span class="required">*</span></label><input id="au-email" type="email"></div>
        <div class="form-group"><label>Password <span class="required">*</span></label><input id="au-pass" type="password"></div>
        <div class="form-group"><label>Contact</label><input id="au-contact"></div>
        <div class="form-group"><label>Role <span class="required">*</span></label>
          <select id="au-role" onchange="toggleUserFields()">
            <option>Doctor</option><option>Staff</option><option>Administrator</option><option>Patient</option>
          </select>
        </div>
        <div class="form-group" id="au-spec-group"><label>Specialty (Doctor)</label>
          <select id="au-spec"><option>General Medicine</option><option>Dental</option><option>Eye</option><option>Mental Health</option></select>
        </div>
        <div class="form-group" id="au-college-group" style="display:none"><label>College</label>
          <select id="au-college">${['CCICT','COE','COED','CME','CAS','COT'].map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeAllModals()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewUser()">Create User</button>
    </div>
  </div>`);
}

function toggleUserFields(){
  const role=document.getElementById('au-role').value;
  document.getElementById('au-spec-group').style.display=role==='Doctor'?'':'none';
  document.getElementById('au-college-group').style.display=role==='Patient'?'':'none';
}

function saveNewUser(){
  const fname=document.getElementById('au-fname').value.trim();
  const lname=document.getElementById('au-lname').value.trim();
  const uname=document.getElementById('au-user').value.trim();
  const email=document.getElementById('au-email').value.trim();
  const pass=document.getElementById('au-pass').value;
  const role=document.getElementById('au-role').value;
  const msg=document.getElementById('adduser-msg');
  if(!fname||!lname||!uname||!email||!pass){showAlert(msg,'All required fields must be filled.');return;}
  if(DB.users.find(u=>u.username===uname)){showAlert(msg,'Username already taken.');return;}
  const uid=DB.nextUserId++;
  const newUser={id:uid,fname,lname,username:uname,password:pass,role,email,contact:document.getElementById('au-contact').value,status:'Active',college:'',personType:'Staff',idNo:'',idFile:'',verified:true,createdAt:TODAY,lastLogin:'',
    ...(role==='Doctor'?{specialty:document.getElementById('au-spec').value,workDays:['Mon','Tue','Wed','Thu','Fri'],startTime:'08:00',endTime:'17:00',slotDuration:60,maxPatients:20}:{})
  };
  DB.users.push(newUser);
  toast(`${role} account created.`,'success');
  closeAllModals();
  renderUserTable&&renderUserTable();
}

function openEditUserModal(id){
  const u=DB.users.find(x=>x.id===id);if(!u)return;
  openModal(`<div class="modal">
    <div class="modal-header"><h3>Edit User – ${u.fname} ${u.lname}</h3><button class="close-btn" onclick="closeAllModals()">✕</button></div>
    <div class="modal-body">
      <div id="edituser-msg"></div>
      <div class="form-row">
        <div class="form-group"><label>First Name</label><input id="eu-fname" value="${u.fname}"></div>
        <div class="form-group"><label>Last Name</label><input id="eu-lname" value="${u.lname}"></div>
        <div class="form-group"><label>Email</label><input id="eu-email" type="email" value="${u.email}"></div>
        <div class="form-group"><label>Contact</label><input id="eu-contact" value="${u.contact||''}"></div>
        <div class="form-group"><label>Status</label>
          <select id="eu-status"><option ${u.status==='Active'?'selected':''}>Active</option><option ${u.status==='Pending'?'selected':''}>Pending</option><option ${u.status==='Suspended'?'selected':''}>Suspended</option></select>
        </div>
        ${u.role==='Doctor'?`<div class="form-group"><label>Specialty</label>
          <select id="eu-spec"><option ${u.specialty==='General Medicine'?'selected':''}>General Medicine</option><option ${u.specialty==='Dental'?'selected':''}>Dental</option></select>
        </div>`:''}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeAllModals()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditUser(${id})">Save</button>
    </div>
  </div>`);
}

function saveEditUser(id){
  const u=DB.users.find(x=>x.id===id);if(!u)return;
  u.fname=document.getElementById('eu-fname').value.trim()||u.fname;
  u.lname=document.getElementById('eu-lname').value.trim()||u.lname;
  u.email=document.getElementById('eu-email').value.trim()||u.email;
  u.contact=document.getElementById('eu-contact').value;
  u.status=document.getElementById('eu-status').value;
  if(u.role==='Doctor')u.specialty=document.getElementById('eu-spec').value;
  toast('User updated.','success');
  closeAllModals();
  renderUserTable&&renderUserTable();
}

function openDoctorScheduleEdit(docId){
  const doc=DB.users.find(u=>u.id===docId);if(!doc)return;
  openModal(`<div class="modal">
    <div class="modal-header"><h3>Edit Schedule – Dr. ${doc.fname} ${doc.lname}</h3><button class="close-btn" onclick="closeAllModals()">✕</button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>Start Time</label><input type="time" id="ds-start" value="${doc.startTime||'08:00'}"></div>
        <div class="form-group"><label>End Time</label><input type="time" id="ds-end" value="${doc.endTime||'17:00'}"></div>
        <div class="form-group"><label>Slot Duration (min)</label><input type="number" id="ds-slot" value="${doc.slotDuration||60}" min="15" max="120"></div>
        <div class="form-group"><label>Max Patients/Day</label><input type="number" id="ds-max" value="${doc.maxPatients||20}" min="1"></div>
      </div>
      <div class="form-group"><label>Work Days</label>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">
          ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<label style="display:flex;align-items:center;gap:.3rem;font-size:.82rem;cursor:pointer"><input type="checkbox" class="ds-day" value="${d}" ${(doc.workDays||[]).includes(d)?'checked':''}> ${d}</label>`).join('')}
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeAllModals()">Cancel</button>
      <button class="btn btn-primary" onclick="saveDoctorSched(${docId})">Save</button>
    </div>
  </div>`);
}

function saveDoctorSched(docId){
  const doc=DB.users.find(u=>u.id===docId);if(!doc)return;
  doc.startTime=document.getElementById('ds-start').value;
  doc.endTime=document.getElementById('ds-end').value;
  doc.slotDuration=parseInt(document.getElementById('ds-slot').value)||60;
  doc.maxPatients=parseInt(document.getElementById('ds-max').value)||20;
  doc.workDays=Array.from(document.querySelectorAll('.ds-day:checked')).map(cb=>cb.value);
  toast('Schedule updated.','success');
  closeAllModals();
  renderSettings&&renderSettings();
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAllModals();});

  const lowStock=getLowStock();
